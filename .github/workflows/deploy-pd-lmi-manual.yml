name: Deploy PD-LMI Manual

on:
  push:
    branches: [main]
    paths:
      - "webpage/dist/**"
      - ".github/workflows/deploy-pd-lmi-manual.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Upload prebuilt static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: webpage/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
